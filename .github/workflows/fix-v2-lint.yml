name: fix-v2-lint

on:
  push:
    branches: ['feat/wedding-band-v2']
    paths: ['.github/workflows/fix-v2-lint.yml']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wedding-band-v2
          fetch-depth: 0
      - name: Apply cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          test_file = Path('tests/e2e/journey.v2.spec.ts')
          text = test_file.read_text()
          text, count = re.subn(
              r"\nasync function finishQuick\(page: Page\) \{.*?\n\}\n\nasync function assertMobileQuality",
              "\nasync function assertMobileQuality",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one finishQuick helper, found {count}')
          test_file.write_text(text)

          context_file = Path('src/features/wedding-band/sessionContext.tsx')
          context = context_file.read_text()
          marker = '/* eslint-disable react-refresh/only-export-components */\n'
          if not context.startswith(marker):
              context_file.write_text(marker + context)
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/journey.v2.spec.ts src/features/wedding-band/sessionContext.tsx
          git commit -m "fix: clean v2 lint issues"
          git push origin HEAD:feat/wedding-band-v2
