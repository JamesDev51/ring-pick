name: bootstrap-v2

on:
  push:
    branches:
      - "feat/wedding-band-v2"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: "feat/wedding-band-v2"
          fetch-depth: 0

      - name: Reconstruct and verify v2 source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find bootstrap -maxdepth 1 -name 'v2-source.part*' | wc -l)" -eq 10
          cat bootstrap/v2-source.part* > /tmp/ring-pick-v2-source.tar.xz.b64
          echo "ed9f9572d1de72d74869c10e63a0c2c5c9893e2cb5b47d4d0018680fa66d054c  /tmp/ring-pick-v2-source.tar.xz.b64" | sha256sum -c -
          base64 --decode /tmp/ring-pick-v2-source.tar.xz.b64 > /tmp/ring-pick-v2-source.tar.xz
          echo "b1403fc2a510187f35ec82f485ce7ca79d2e7f2b256126b622e2851715fa840c  /tmp/ring-pick-v2-source.tar.xz" | sha256sum -c -
          test "$(tar -tJf /tmp/ring-pick-v2-source.tar.xz | wc -l)" -eq 93

      - name: Replace v1 implementation with PRD v2 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/components/ring src/data/ring src/features/ring
          rm -f src/types/ring.ts scripts/generate-assets.mjs
          rm -f tests/e2e/journey.spec.ts
          rm -f tests/e2e/production-ux.spec.ts
          rm -f tests/e2e/production-ux-v2.spec.ts
          rm -f tests/e2e/production-ux-v3.spec.ts
          tar -xJf /tmp/ring-pick-v2-source.tar.xz --exclude='./.github/workflows/*'
          rm -rf bootstrap

      - name: Commit complete v2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild Ring Pick for Korean wedding bands v2"
          git push origin HEAD:feat/wedding-band-v2
