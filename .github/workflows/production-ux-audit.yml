name: production-ux-audit-v2

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Wait for Vercel production
        run: |
          for i in {1..24}; do
            if curl -fsS https://ring-pick.vercel.app | grep -q '웨딩밴드'; then exit 0; fi
            sleep 5
          done
          echo 'Production did not expose the v2 HTML in time' >&2
          exit 1
      - run: npx playwright install --with-deps chromium webkit
      - name: Run production user journeys
        env:
          PLAYWRIGHT_BASE_URL: https://ring-pick.vercel.app
          UX_AUDIT: 1
        run: npm run e2e
      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ux-v2-artifacts
          path: |
            playwright-report
            test-results
            ux-artifacts-v2
          if-no-files-found: ignore
          retention-days: 7
