name: production-ux-audit

on:
  push:
    paths:
      - '.github/workflows/production-ux-audit.yml'
      - 'tests/e2e/production-ux-v2.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production UX audit
        env:
          UX_AUDIT: '1'
          PLAYWRIGHT_BASE_URL: 'https://ring-pick.vercel.app'
        run: npx playwright test tests/e2e/production-ux-v2.spec.ts

      - name: Upload UX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ux-artifacts-v2
          path: |
            ux-artifacts-v2
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
