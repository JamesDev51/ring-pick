name: ci

on:
  push:
    branches: ['master', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint, unit, assets and build
        run: npm run verify
      - name: Install mobile browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Mobile E2E
        run: npm run e2e
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ring-pick-v2-test-report
          path: |
            playwright-report
            test-results
          retention-days: 7
