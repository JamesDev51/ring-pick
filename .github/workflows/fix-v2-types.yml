name: fix-v2-types

on:
  push:
    branches: ['feat/wedding-band-v2']
    paths: ['.github/workflows/fix-v2-types.yml']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wedding-band-v2
          fetch-depth: 0
      - name: Patch strict React and session narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/PlayPage.tsx')
          s = p.read_text()
          replacements = [
            ('const previousRound = useRef<number>();', 'const previousRound = useRef<number | undefined>(undefined);'),
            ("function pickDiagnostic(choice: DiagnosticChoice) {\n    if (locked) return;", "function pickDiagnostic(choice: DiagnosticChoice) {\n    if (locked || !session) return;"),
            ("function pickTournament(id: string, side: 'a' | 'b') {\n    if (locked) return;", "function pickTournament(id: string, side: 'a' | 'b') {\n    if (locked || !session) return;"),
          ]
          for before, after in replacements:
            if before not in s:
              raise SystemExit(f'missing expected snippet: {before}')
            s = s.replace(before, after, 1)
          p.write_text(s)
          PY
      - name: Commit strict type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/PlayPage.tsx
          git commit -m "fix: satisfy strict v2 TypeScript checks"
          git push origin HEAD:feat/wedding-band-v2
