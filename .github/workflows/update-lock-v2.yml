name: update-lock-v2

on:
  push:
    branches: ['feat/wedding-band-v2']
    paths: ['.github/workflows/update-lock-v2.yml']

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wedding-band-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize v2 dependency lockfile"
          git push origin HEAD:feat/wedding-band-v2
